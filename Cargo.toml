[workspace]
members = [
    "crates/fg-admin",
    "crates/fg-auth",
    "crates/fg-config",
    "crates/fg-core",
    "crates/fg-gateway",
    "crates/fg-i18n",
    "crates/fg-logging",
    "crates/fg-net",
    "crates/fg-testkit",
    "crates/xtask"
]
default-members = [".", "crates/fg-gateway"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["houseme <housemecn@gmail.com>"]

# All dependency versions are managed here. Member manifests only reference
# entries with `workspace = true` and may add features on top of them.
[workspace.dependencies]
# Internal crates
fg-admin = { path = "crates/fg-admin", version = "0.1.0" }
fg-auth = { path = "crates/fg-auth", version = "0.1.0" }
fg-config = { path = "crates/fg-config", version = "0.1.0" }
fg-core = { path = "crates/fg-core", version = "0.1.0" }
fg-gateway = { path = "crates/fg-gateway", version = "0.1.0" }
fg-i18n = { path = "crates/fg-i18n", version = "0.1.0" }
fg-logging = { path = "crates/fg-logging", version = "0.1.0" }
fg-net = { path = "crates/fg-net", version = "0.1.0" }
fg-testkit = { path = "crates/fg-testkit", version = "0.1.0" }
# External crates
anyhow = "1"
arc-swap = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
base64 = "0.23"
bcrypt = "0.19"
cap-std = "4"
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
h2 = "0.4"
hmac = "0.12"
hickory-proto = "0.26"
hickory-resolver = { version = "0.26.4", default-features = false, features = ["tokio"] }
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
instant-acme = { version = "0.8", default-features = false, features = ["hyper-rustls", "rcgen", "ring"] }
ipnet = "2"
jiff-tzdb = "1"
libc = "0.2"
mime = "0.3"
mime_guess = "2"
openidconnect = { version = "4.1", default-features = false }
pem = "4"
percent-encoding = "2"
rcgen = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "socks"] }
ring = "0.17"
rpassword = "7"
rustix = { version = "1", features = ["fs"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
subtle = "2"
tempfile = "3"
time = "0.3"
tokio = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = { version = "0.1", default-features = false }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
url = "2"
webauthn-authenticator-rs = { version = "0.6", default-features = false, features = ["softpasskey"] }
webauthn-rs = { version = "0.6", default-features = false }
webpki-roots = "1"
x509-parser = "0.18"

[package]
name = "ferrumgate"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
fg-admin.workspace = true
fg-auth.workspace = true
fg-config.workspace = true
fg-core.workspace = true
fg-gateway.workspace = true
fg-i18n.workspace = true
fg-logging.workspace = true
getrandom.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
rpassword.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
webpki-roots.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[[bin]]
name = "fgate"
path = "src/main.rs"


[dev-dependencies]
bcrypt.workspace = true
data-encoding.workspace = true
futures-util = { workspace = true, features = ["sink"] }
h2.workspace = true
ring.workspace = true
hickory-proto.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
rcgen.workspace = true
rustls.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "process", "sync", "time"] }
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
x509-parser.workspace = true
