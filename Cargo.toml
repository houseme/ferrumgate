[workspace]
members = ["crates/fg-admin", "crates/fg-auth", "crates/fg-config", "crates/fg-core", "crates/fg-gateway", "crates/fg-logging", "crates/fg-testkit"]
default-members = [".", "crates/fg-gateway"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
time = "0.3"
tokio = "1"
tracing = "0.1"

[package]
name = "ferrumgate"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4", features = ["derive"] }
fg-admin = { path = "crates/fg-admin" }
fg-auth = { path = "crates/fg-auth" }
fg-config = { path = "crates/fg-config" }
fg-core = { path = "crates/fg-core" }
fg-gateway = { path = "crates/fg-gateway" }
fg-logging = { path = "crates/fg-logging" }
rpassword = "7"
time.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[[bin]]
name = "fgate"
path = "src/main.rs"


[dev-dependencies]
futures-util = { version = "0.3", features = ["sink"] }
h2 = "0.4"
hickory-proto = "0.26"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rcgen = "0.14"
serde_json.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "process", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
x509-parser = "0.18"
