[workspace]
members = [
    "crates/fg-admin",
    "crates/fg-auth",
    "crates/fg-config",
    "crates/fg-core",
    "crates/fg-cron",
    "crates/fg-ddns",
    "crates/fg-dns",
    "crates/fg-frp",
    "crates/fg-cloudflared",
    "crates/fg-knock",
    "crates/fg-tailscale",
    "crates/fg-netbird",
    "crates/fg-easytier",
    "crates/fg-gateway",
    "crates/fg-filebrowser",
    "crates/fg-guard",
    "crates/fg-notify",
    "crates/fg-i18n",
    "crates/fg-logging",
    "crates/fg-nettools",
    "crates/fg-net",
    "crates/fg-proc",
    "crates/fg-stun",
    "crates/fg-testkit",
    "crates/fg-waf-engine",
    "crates/xtask"
]
default-members = [".", "crates/fg-gateway"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["houseme <housemecn@gmail.com>"]

# All dependency versions are managed here. Member manifests only reference
# entries with `workspace = true` and may add features on top of them.
[workspace.dependencies]
# Internal crates
fg-admin = { path = "crates/fg-admin", version = "0.1.0" }
fg-auth = { path = "crates/fg-auth", version = "0.1.0" }
fg-config = { path = "crates/fg-config", version = "0.1.0" }
fg-core = { path = "crates/fg-core", version = "0.1.0" }
fg-cron = { path = "crates/fg-cron", version = "0.1.0" }
fg-dns = { path = "crates/fg-dns", version = "0.1.0" }
fg-ddns = { path = "crates/fg-ddns", version = "0.1.0" }
fg-frp = { path = "crates/fg-frp", version = "0.1.0" }
fg-cloudflared = { path = "crates/fg-cloudflared", version = "0.1.0" }
fg-knock = { path = "crates/fg-knock", version = "0.1.0" }
fg-tailscale = { path = "crates/fg-tailscale", version = "0.1.0" }
fg-netbird = { path = "crates/fg-netbird", version = "0.1.0" }
fg-easytier = { path = "crates/fg-easytier", version = "0.1.0" }
fg-gateway = { path = "crates/fg-gateway", version = "0.1.0" }
fg-guard = { path = "crates/fg-guard", version = "0.1.0" }
fg-i18n = { path = "crates/fg-i18n", version = "0.1.0" }
fg-logging = { path = "crates/fg-logging", version = "0.1.0" }
fg-net = { path = "crates/fg-net", version = "0.1.0" }
fg-nettools = { path = "crates/fg-nettools", version = "0.1.0" }
fg-notify = { path = "crates/fg-notify", version = "0.1.0" }
fg-waf-engine = { path = "crates/fg-waf-engine", version = "0.1.0" }
fg-filebrowser = { path = "crates/fg-filebrowser", version = "0.1.0" }
fg-proc = { path = "crates/fg-proc", version = "0.1.0" }
fg-stun = { path = "crates/fg-stun", version = "0.1.0" }
fg-testkit = { path = "crates/fg-testkit", version = "0.1.0" }
# External crates
aes = "0.8"
anyhow = "1"
arc-swap = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
base64 = "0.23"
bcrypt = "0.19"
cap-std = "4"
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
h2 = "0.4"
hex = "0.4"
hickory-proto = "0.26"
hmac = "0.12"
hickory-resolver = { version = "0.26.4", default-features = false, features = ["tokio"] }
if-addrs = "0.13"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
instant-acme = { version = "0.8", default-features = false, features = ["hyper-rustls", "rcgen", "ring"] }
ipnet = "2"
jiff-tzdb = "1"
libc = "0.2"
md-5 = "0.10"
mime = "0.3"
mime_guess = "2"
openidconnect = { version = "4.1", default-features = false }
pem = "4"
percent-encoding = "2"
rcgen = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "socks"] }
regex = "1"
ring = "0.17"
rpassword = "7"
rustix = { version = "1", features = ["fs"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
# WP-71 nettools: unprivileged ICMP dgram sockets (safe creation only).
socket2 = "0.6"
serde_json = "1"
subtle = "2"
tar = "0.4"
tempfile = "3"
time = "0.3"
tokio = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = { version = "0.1", default-features = false }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
url = "2"
webauthn-authenticator-rs = { version = "0.6", default-features = false, features = ["softpasskey"] }
webauthn-rs = { version = "0.6", default-features = false }
webpki-roots = "1"
x509-parser = "0.18"
zip = { version = "2.6", default-features = false, features = ["deflate"] }

[package]
name = "ferrumgate"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
fg-admin.workspace = true
fg-auth.workspace = true
fg-config.workspace = true
fg-core.workspace = true
fg-gateway.workspace = true
fg-i18n.workspace = true
fg-logging.workspace = true
fg-net.workspace = true
getrandom.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
rpassword.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
toml.workspace = true
webpki-roots.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
# Optional module crates: one `mod-<id>` feature per implemented module,
# regenerated by `cargo xtask modules gen` from features.toml (WP-90).
fg-ddns = { workspace = true, optional = true }
fg-stun = { workspace = true, optional = true }
fg-tailscale = { workspace = true, optional = true }
fg-netbird = { workspace = true, optional = true }
fg-easytier = { workspace = true, optional = true }
fg-frp = { workspace = true, optional = true }
fg-cloudflared = { workspace = true, optional = true }
fg-guard = { workspace = true, optional = true }
fg-knock = { workspace = true, optional = true }
fg-cron = { workspace = true, optional = true }
fg-filebrowser = { workspace = true, optional = true }
fg-notify = { workspace = true, optional = true }
fg-nettools = { workspace = true, optional = true }

[features]
# Generated by `cargo xtask modules gen` from features.toml (WP-90); do not edit by hand.
default = ["mod-ddns", "mod-stun", "mod-tailscale", "mod-netbird", "mod-easytier", "mod-frp", "mod-cloudflared", "mod-guard", "mod-knock", "mod-cron", "mod-filebrowser", "mod-notify", "mod-nettools", "lang-all"]
# TODO(WP-90 step 6, WP-10): tiers only toggle the feature; trimming the embedded
# catalogs (backend messages and fg-ui locales) is not wired yet.
lang-all = ["fg-core/lang-all"]
lang-cjk-en = ["fg-core/lang-cjk-en"]
lang-zh-cn = ["fg-core/lang-zh-cn"]
mod-ddns = ["dep:fg-ddns", "fg-core/mod-ddns"]
mod-stun = ["dep:fg-stun", "fg-core/mod-stun"]
mod-tailscale = ["dep:fg-tailscale", "fg-core/mod-tailscale"]
mod-netbird = ["dep:fg-netbird", "fg-core/mod-netbird"]
mod-easytier = ["dep:fg-easytier", "fg-core/mod-easytier"]
mod-frp = ["dep:fg-frp", "fg-core/mod-frp"]
mod-cloudflared = ["dep:fg-cloudflared", "fg-core/mod-cloudflared"]
mod-guard = ["dep:fg-guard", "fg-core/mod-guard"]
mod-knock = ["dep:fg-knock", "fg-core/mod-knock"]
mod-cron = ["dep:fg-cron", "fg-core/mod-cron"]
mod-filebrowser = ["dep:fg-filebrowser", "fg-core/mod-filebrowser"]
mod-notify = ["dep:fg-notify", "fg-core/mod-notify"]
mod-nettools = ["dep:fg-nettools", "fg-core/mod-nettools"]

[[bin]]
name = "fgate"
path = "src/main.rs"


[dev-dependencies]
bcrypt.workspace = true
data-encoding.workspace = true
futures-util = { workspace = true, features = ["sink"] }
h2.workspace = true
ring.workspace = true
hickory-proto.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
rcgen.workspace = true
rustls.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "process", "sync", "time"] }
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
x509-parser.workspace = true
