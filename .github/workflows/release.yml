# Multi-platform release build & packaging workflow (WP-92).
#
# Signing, provenance verification, and GitHub Release publishing are wired in
# WP-93 / WP-94; this workflow builds the unsigned binary/package artifacts and
# publishes the multi-architecture Docker image with SBOM and max provenance.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v0.5.4)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Minimal default permissions; write scopes are granted only on jobs that need them.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: Build release binaries & packages
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - name: Cache cargo registry, git deps and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-
      - name: Install pinned cargo-zigbuild (0.24.1)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.24.1
      - name: Resolve release version and target matrix
        id: meta
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          cargo run --locked -p xtask -- package targets
      - name: Build Linux, Windows, FreeBSD, fnOS and OpenWrt artifacts
        run: |
          cargo run --locked -p xtask -- package build \
            --version "${{ steps.meta.outputs.version }}" \
            --commit "${{ github.sha }}" \
            --build-date "${{ steps.meta.outputs.build_date }}" \
            --targets linux-amd64,linux-arm64,linux-arm,windows-amd64,freebsd-amd64 \
            --out dist/bin
      - name: Package release tarballs and LuCI staging
        run: |
          for target in linux-amd64 linux-arm64 linux-arm windows-amd64 freebsd-amd64; do
            exe="fgate"
            if [ "$target" = "windows-amd64" ]; then exe="fgate.exe"; fi
            cargo run --locked -p xtask -- package tar \
              --binary "dist/bin/${target}/${exe}" \
              --version "${{ steps.meta.outputs.version }}" \
              --target "${target}" \
              --out dist/artifacts
          done
          cargo run --locked -p xtask -- package luci \
            --version "${{ steps.meta.outputs.version }}" \
            --out dist/artifacts
      - name: Upload unsigned release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-linux
          path: dist/artifacts
          if-no-files-found: error

  binaries-macos:
    name: Build macOS release binaries
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust stable (darwin targets)
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          target: x86_64-apple-darwin,aarch64-apple-darwin
          cache: false
      - name: Resolve release version
        id: meta
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build and archive darwin-amd64 and darwin-arm64
        run: |
          cargo run --locked -p xtask -- package build \
            --version "${{ steps.meta.outputs.version }}" \
            --commit "${{ github.sha }}" \
            --build-date "${{ steps.meta.outputs.build_date }}" \
            --targets darwin-amd64,darwin-arm64 \
            --out dist/bin
          for target in darwin-amd64 darwin-arm64; do
            cargo run --locked -p xtask -- package tar \
              --binary "dist/bin/${target}/fgate" \
              --version "${{ steps.meta.outputs.version }}" \
              --target "${target}" \
              --out dist/artifacts
          done
      - name: Upload unsigned macOS release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-macos
          path: dist/artifacts
          if-no-files-found: error

  image:
    name: Build & push multi-arch Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub (optional)
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/ferrumgate', secrets.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - name: Build and push multi-platform image with SBOM and provenance
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.version || github.ref_name }}
            COMMIT=${{ github.sha }}
            WITH_DOCKER_CLI=1
            WITH_NFTABLES=1
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
