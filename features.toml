# 语言档位：feature 名对应根 Cargo.toml 的 lang-*；tag 是上游的构建标签。
[[language]]
id = "all"
feature = "lang-all"
locales = ["zh-CN", "zh-TW", "en", "de", "es", "fr", "ja", "ko", "pt-BR", "ru"]

[[language]]
id = "cjk-en"
feature = "lang-cjk-en"
tag = "lang_cjken"
locales = ["zh-CN", "zh-TW", "en"]
size_kb = 704

[[language]]
id = "zh"
feature = "lang-zh-cn"
tag = "lang_zh"
locales = ["zh-CN"]
size_kb = 896

