# 预设只是可选模块列表的简写；核心模块始终包含。
[[preset]]
id = "minimal"
modules = []

[[preset]]
id = "router"
modules = ["protoroute", "ddns", "stun", "frp", "guard", "knock", "wol", "cron", "notify", "nettools"]

[[preset]]
id = "nas"
modules = [
    "protoroute",
    "ddns",
    "stun",
    "frp",
    "guard",
    "knock",
    "wol",
    "cron",
    "notify",
    "nettools",
    "tailscale",
    "cloudflared",
    "webterminal",
    "docker",
    "webdav",
    "smb",
    "filebrowser",
    "storage",
    "perf",
    "backup",
]
