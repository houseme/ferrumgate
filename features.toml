# 模块清单的唯一来源（WP-90）。由它生成：根 Cargo.toml 的 [features] 段与可选模块依赖、
# crates/fg-core/src/features.rs、modules.json——用 `cargo xtask modules gen` 重新生成，
# 用 `cargo xtask modules check` 校验一致性。
