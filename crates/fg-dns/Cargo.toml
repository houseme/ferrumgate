[package]
name = "fg-dns"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
base64.workspace = true
getrandom.workspace = true
hex.workspace = true
hmac.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls = { workspace = true, features = ["webpki-roots"] }
hyper-util.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "net", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
# 构建测试时启用全部提供商 feature（`cargo test -p fg-dns` 即覆盖所有契约测试）。
fg-dns = { path = ".", features = [
    "dns-alidns",
    "dns-aliesa",
    "dns-baiducloud",
    "dns-bunny",
    "dns-callback",
    "dns-cloudflare",
    "dns-cloudns",
    "dns-desec",
    "dns-dnsla",
    "dns-dnspod",
    "dns-dnspodcom",
    "dns-duckdns",
    "dns-dynadot",
    "dns-dyndns2",
    "dns-dynv6",
    "dns-edgeone",
    "dns-eranet",
    "dns-gandi",
    "dns-gcore",
    "dns-godaddy",
    "dns-hipmdnsmgr",
    "dns-huaweicloud",
    "dns-namecheap",
    "dns-namecom",
    "dns-namesilo",
    "dns-nowcn",
    "dns-ns1",
    "dns-ovh",
    "dns-porkbun",
    "dns-rainyun",
    "dns-route53",
    "dns-spaceship",
    "dns-tencentcloud",
    "dns-tnethk",
    "dns-trafficroute",
    "dns-vercel",
] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt-multi-thread"] }

[features]
default = []
dns-alidns = []
dns-aliesa = []
dns-baiducloud = []
dns-bunny = []
