[package]
name = "fg-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[features]
schema = ["dep:schemars"]
# Forwarded from the root crate's generated `mod-*` / `lang-*` features
# (WP-90): `features.rs` derives the build constants from these. One
# switch per optional module, whether or not the module crate exists yet,
# so the cfg names are always declared.
mod-guard = []
mod-cron = []
mod-protoroute = []
mod-ddns = []
mod-stun = []
mod-tailscale = []
mod-netbird = []
mod-easytier = []
mod-frp = []
mod-cloudflared = []
mod-waf = []
mod-knock = []
mod-wol = []
mod-webterminal = []
mod-docker = []
mod-webdav = []
mod-ftp = []
mod-smb = []
mod-filebrowser = []
mod-storage = []
mod-notify = []
mod-perf = []
mod-nettools = []
mod-backup = []
lang-all = []
lang-cjk-en = []
lang-zh-cn = []

[dependencies]
anyhow.workspace = true
arc-swap.workspace = true
data-encoding.workspace = true
hmac.workspace = true
futures-util.workspace = true
ipnet.workspace = true
jiff-tzdb.workspace = true
schemars = { workspace = true, optional = true }
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
tracing.workspace = true
url.workspace = true

[build-dependencies]
serde.workspace = true
toml.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "time"] }
