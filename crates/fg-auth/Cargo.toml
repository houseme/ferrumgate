[package]
name = "fg-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
arc-swap = "1"
base64 = "0.22"
bcrypt = "0.19"
data-encoding = "2"
fg-config = { path = "../fg-config" }
fg-core = { path = "../fg-core" }
getrandom = "0.4"
openidconnect = { version = "4.1", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
ring = "0.17"
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
subtle = "2"
time = { workspace = true, features = ["formatting", "parsing", "serde", "std"] }
tokio = { workspace = true, features = ["rt", "time"] }
webauthn-rs = { version = "0.6", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
webauthn-authenticator-rs = { version = "0.6", default-features = false, features = ["softpasskey"] }
